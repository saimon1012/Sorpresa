<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Digital ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #2d0b1e 0%, #12030c 100%);
            overflow-x: hidden;
            min-height: 100vh;
        }
        .font-serif-title { font-family: 'Playfair Display', serif; }
        .font-handwriting { font-family: 'Dancing Script', cursive; }

        /* ===== PLANTILLAS DE CARTA ===== */
        .plantilla-clasica {
            background: #fdfbf7;
            color: #3b2b1f;
        }
        .plantilla-clasica .letter-body {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
        }
        .plantilla-romantica {
            background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
            color: #831843;
        }
        .plantilla-romantica .letter-body {
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
        }
        .plantilla-elegante {
            background: #1a1a1a;
            color: #e5e5e5;
        }
        .plantilla-elegante .letter-body {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-style: italic;
        }
        .plantilla-elegante .letter-to { color: #f5d76e; }
        .plantilla-moderna {
            background: #ffffff;
            color: #111827;
            border-left: 6px solid #f43f5e;
        }
        .plantilla-moderna .letter-body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1rem;
            font-weight: 300;
        }

        /* ===== SOBRE 3D ===== */
        .perspective-1000 { perspective: 1000px; }
        .envelope-wrapper {
            position: relative;
            width: 320px;
            height: 220px;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @media (min-width: 640px) {
            .envelope-wrapper { width: 380px; height: 250px; }
        }
        .envelope-wrapper:hover { transform: translateY(-8px) scale(1.02); }
        .envelope-back {
            position: absolute; width: 100%; height: 100%;
            background: #9f1239; border-radius: 12px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.7);
        }
        .letter-card {
            position: absolute; left: 5%; width: 90%; height: 90%; top: 5%;
            background: #fdfbf7; border-radius: 8px; padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: all 0.8s cubic-bezier(0.4,0,0.2,1);
            z-index: 2; overflow: hidden; border: 1px solid #f3e8ff;
        }
        .envelope-wrapper.open .letter-card {
            transform: translateY(-130px) scale(1.03);
            height: auto; min-height: 260px; max-height: 480px;
            overflow-y: auto; z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .letter-card::-webkit-scrollbar { width: 4px; }
        .letter-card::-webkit-scrollbar-thumb { background: #f43f5e; border-radius: 4px; }
        .envelope-flap {
            position: absolute; top: 0; left: 0; width: 100%; height: 50%;
            background: #be123c; clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top;
            transition: transform 0.6s ease-in-out, z-index 0.6s ease-in-out;
            z-index: 5; border-top-left-radius: 12px; border-top-right-radius: 12px;
        }
        .envelope-wrapper.open .envelope-flap { transform: rotateX(180deg); z-index: 1; }
        .envelope-pocket-left {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            background: #e11d48; clip-path: polygon(0 0, 0 100%, 50% 50%);
            border-bottom-left-radius: 12px; z-index: 3;
        }
        .envelope-pocket-right {
            position: absolute; bottom: 0; right: 0; width: 100%; height: 100%;
            background: #be123c; clip-path: polygon(100% 0, 100% 100%, 50% 50%);
            border-bottom-right-radius: 12px; z-index: 3;
        }
        .envelope-pocket-bottom {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            background: #881337; clip-path: polygon(0 100%, 100% 100%, 50% 48%);
            border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; z-index: 4;
        }
        .wax-seal {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 52px; height: 52px;
            background: radial-gradient(circle at 30% 30%, #fb7185, #9f1239);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.3);
            z-index: 6; transition: opacity 0.4s ease, transform 0.4s ease; cursor: pointer;
        }
        .envelope-wrapper.open .wax-seal {
            opacity: 0; transform: translate(-50%, -50%) scale(0.5); pointer-events: none;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1.5deg); }
        }
        .floating-bouquet { animation: floatSlow 6s ease-in-out infinite; }
        @keyframes shine {
            0% { opacity: 0.3; } 50% { opacity: 0.8; } 100% { opacity: 0.3; }
        }
        .sparkle-effect { animation: shine 3s infinite ease-in-out; }

        /* Toast */
        .toast {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b; color: #fff; padding: 14px 24px;
            border-radius: 8px; font-size: 0.9rem; opacity: 0;
            transition: all 0.3s; z-index: 1000; text-align: center;
            max-width: 90%; border: 1px solid #f43f5e;
        }
        .toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Modales */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px); z-index: 900;
            display: none; align-items: center; justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #1e293b; border-radius: 16px; padding: 2rem;
            max-width: 450px; width: 100%; border: 1px solid #334155;
            max-height: 90vh; overflow-y: auto;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col min-h-screen relative selection:bg-rose-500 selection:text-white">

    <canvas id="petalsCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- HEADER -->
    <header class="relative z-20 w-full px-4 sm:px-6 py-3 sm:py-4 flex justify-between items-center max-w-6xl mx-auto gap-2">
        <div class="flex items-center gap-2 min-w-0">
            <span class="text-rose-500 text-xl sm:text-2xl"><i class="fa-solid fa-heart"></i></span>
            <span class="font-serif-title font-semibold text-sm sm:text-lg tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-rose-200 to-pink-400 truncate">
                Cartas Digitales
            </span>
        </div>
        <div class="flex items-center gap-2">
            <button id="musicToggleBtn" onclick="toggleAudio()" class="bg-rose-950/60 hover:bg-rose-900/80 text-rose-200 border border-rose-800/50 px-3 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-medium transition flex items-center gap-2 backdrop-blur-md">
                <i id="musicIcon" class="fa-solid fa-music text-rose-400"></i>
                <span id="musicText" class="hidden sm:inline">Música</span>
            </button>
            <button id="authBtn" onclick="handleAuthClick()" class="bg-slate-900/80 hover:bg-slate-800 text-slate-200 border border-slate-700/60 px-3 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm transition backdrop-blur-md flex items-center gap-2">
                <i id="authIcon" class="fa-solid fa-user"></i>
                <span id="authText" class="hidden sm:inline">Entrar</span>
            </button>
        </div>
    </header>

    <!-- MAIN -->
    <main class="relative z-10 flex-1 max-w-6xl w-full mx-auto px-4 py-4 flex flex-col lg:flex-row items-center justify-center gap-8 lg:gap-8">

        <!-- RAMO -->
        <section class="flex-1 flex flex-col items-center justify-center w-full max-w-lg order-2 lg:order-1">
            <div class="relative w-full aspect-square max-w-[300px] sm:max-w-[420px] flex items-center justify-center floating-bouquet">
                <div class="absolute w-56 h-56 sm:w-72 sm:h-72 bg-gradient-to-tr from-rose-600/30 via-pink-500/20 to-amber-300/20 rounded-full filter blur-3xl -z-10"></div>
                <svg viewBox="0 0 500 550" class="w-full h-full drop-shadow-2xl overflow-visible" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="roseGradient1" cx="40%" cy="40%" r="60%">
                            <stop offset="0%" stop-color="#f43f5e"/><stop offset="50%" stop-color="#e11d48"/><stop offset="100%" stop-color="#881337"/>
                        </radialGradient>
                        <radialGradient id="roseGradient2" cx="35%" cy="35%" r="65%">
                            <stop offset="0%" stop-color="#fb7185"/><stop offset="60%" stop-color="#be123c"/><stop offset="100%" stop-color="#4c0519"/>
                        </radialGradient>
                        <radialGradient id="daisyCenter" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#fde047"/><stop offset="80%" stop-color="#ca8a04"/><stop offset="100%" stop-color="#854d0e"/>
                        </radialGradient>
                        <linearGradient id="tulipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f472b6"/><stop offset="70%" stop-color="#db2777"/><stop offset="100%" stop-color="#831843"/>
                        </linearGradient>
                        <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#fb7185"/><stop offset="50%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#9f1239"/>
                        </linearGradient>
                        <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#4ade80"/><stop offset="50%" stop-color="#16a34a"/><stop offset="100%" stop-color="#064e3b"/>
                        </linearGradient>
                        <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#14532d"/>
                        </linearGradient>
                    </defs>
                    <g id="stems" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round">
                        <path d="M 230 420 L 200 510"/><path d="M 245 420 L 230 520"/>
                        <path d="M 255 420 L 265 520"/><path d="M 270 420 L 300 500"/>
                        <path d="M 220 420 L 170 490"/>
                    </g>
                    <g id="foliage">
                        <path d="M 220 380 Q 120 350 110 260 Q 180 300 230 350 Z" fill="url(#leafGrad)" opacity="0.95"/>
                        <path d="M 280 380 Q 380 350 390 260 Q 320 300 270 350 Z" fill="url(#leafGrad)" opacity="0.95"/>
                        <path d="M 250 260 Q 230 140 250 90 Q 270 140 250 260 Z" fill="#166534" opacity="0.8"/>
                        <path d="M 180 300 Q 110 200 160 170 Q 190 230 200 290 Z" fill="url(#leafGrad)"/>
                    </g>
                    <g id="lavender" stroke="#a855f7" stroke-width="3">
                        <path d="M 170 260 Q 130 180 140 120" stroke="#4adede" stroke-width="2" fill="none"/>
                        <circle cx="140" cy="120" r="5" fill="#38bdf8"/><circle cx="145" cy="135" r="4" fill="#38bdf8"/>
                        <circle cx="132" cy="140" r="4" fill="#38bdf8"/><circle cx="150" cy="155" r="4" fill="#38bdf8"/>
                        <path d="M 330 260 Q 370 180 360 120" stroke="#c084fc" stroke-width="2" fill="none"/>
                        <circle cx="360" cy="120" r="5" fill="#c084fc"/><circle cx="352" cy="135" r="4" fill="#c084fc"/>
                        <circle cx="368" cy="140" r="4" fill="#c084fc"/><circle cx="348" cy="155" r="4" fill="#c084fc"/>
                    </g>
                    <g id="tulip-left" transform="translate(140, 180)">
                        <path d="M 20 60 C -10 30 -5 -10 20 -20 C 30 10 35 30 20 60 Z" fill="url(#tulipGrad)"/>
                        <path d="M 20 60 C 50 30 45 -10 20 -20 C 10 10 5 30 20 60 Z" fill="url(#tulipGrad)"/>
                        <path d="M 20 60 C 0 20 40 20 20 -25 C 5 15 35 15 20 60 Z" fill="#f472b6"/>
                    </g>
                    <g id="tulip-right" transform="translate(320, 190) scale(0.9)">
                        <path d="M 20 60 C -10 30 -5 -10 20 -20 C 30 10 35 30 20 60 Z" fill="url(#tulipGrad)"/>
                        <path d="M 20 60 C 50 30 45 -10 20 -20 C 10 10 5 30 20 60 Z" fill="url(#tulipGrad)"/>
                        <path d="M 20 60 C 0 20 40 20 20 -25 C 5 15 35 15 20 60 Z" fill="#f472b6"/>
                    </g>
                    <g id="daisy1" transform="translate(190, 160)">
                        <g fill="#ffffff" opacity="0.95">
                            <ellipse cx="0" cy="-22" rx="6" ry="16"/><ellipse cx="0" cy="22" rx="6" ry="16"/>
                            <ellipse cx="-22" cy="0" rx="16" ry="6"/><ellipse cx="22" cy="0" rx="16" ry="6"/>
                            <ellipse cx="-15" cy="-15" rx="6" ry="16" transform="rotate(45 -15 -15)"/>
                            <ellipse cx="15" cy="15" rx="6" ry="16" transform="rotate(45 15 15)"/>
                            <ellipse cx="-15" cy="15" rx="6" ry="16" transform="rotate(-45 -15 15)"/>
                            <ellipse cx="15" cy="-15" rx="6" ry="16" transform="rotate(-45 15 -15)"/>
                        </g>
                        <circle cx="0" cy="0" r="10" fill="url(#daisyCenter)"/>
                    </g>
                    <g id="daisy2" transform="translate(300, 160)">
                        <g fill="#ffffff" opacity="0.95">
                            <ellipse cx="0" cy="-22" rx="6" ry="16"/><ellipse cx="0" cy="22" rx="6" ry="16"/>
                            <ellipse cx="-22" cy="0" rx="16" ry="6"/><ellipse cx="22" cy="0" rx="16" ry="6"/>
                            <ellipse cx="-15" cy="-15" rx="6" ry="16" transform="rotate(45 -15 -15)"/>
                            <ellipse cx="15" cy="15" rx="6" ry="16" transform="rotate(45 15 15)"/>
                            <ellipse cx="-15" cy="15" rx="6" ry="16" transform="rotate(-45 -15 15)"/>
                            <ellipse cx="15" cy="-15" rx="6" ry="16" transform="rotate(-45 15 -15)"/>
                        </g>
                        <circle cx="0" cy="0" r="10" fill="url(#daisyCenter)"/>
                    </g>
                    <g id="center-rose" transform="translate(250, 210)">
                        <path d="M -45 -10 C -60 -40 -10 -60 0 -40 C 10 -60 60 -40 45 -10 C 60 30 10 60 0 50 C -10 60 -60 30 -45 -10 Z" fill="url(#roseGradient1)"/>
                        <path d="M -35 -5 C -45 -30 -5 -45 0 -30 C 5 -45 45 -30 35 -5 C 45 20 5 45 0 38 C -5 45 -45 20 -35 -5 Z" fill="url(#roseGradient2)"/>
                        <path d="M -20 -5 C -25 -20 0 -30 0 -15 C 15 -30 25 -15 20 0 C 25 15 0 25 -5 12 C -20 20 -25 5 -20 -5 Z" fill="#fda4af"/>
                        <path d="M -10 -5 C -10 -15 5 -15 5 -5 C 5 5 -10 5 -10 -5 Z" fill="#fff1f2"/>
                    </g>
                    <g id="left-rose" transform="translate(190, 275) scale(0.9) rotate(-15)">
                        <path d="M -45 -10 C -60 -40 -10 -60 0 -40 C 10 -60 60 -40 45 -10 C 60 30 10 60 0 50 C -10 60 -60 30 -45 -10 Z" fill="url(#roseGradient1)"/>
                        <path d="M -35 -5 C -45 -30 -5 -45 0 -30 C 5 -45 45 -30 35 -5 C 45 20 5 45 0 38 C -5 45 -45 20 -35 -5 Z" fill="url(#roseGradient2)"/>
                        <path d="M -20 -5 C -25 -20 0 -30 0 -15 C 15 -30 25 -15 20 0 C 25 15 0 25 -5 12 C -20 20 -25 5 -20 -5 Z" fill="#fda4af"/>
                        <circle cx="0" cy="-2" r="5" fill="#fff1f2"/>
                    </g>
                    <g id="right-rose" transform="translate(310, 275) scale(0.9) rotate(15)">
                        <path d="M -45 -10 C -60 -40 -10 -60 0 -40 C 10 -60 60 -40 45 -10 C 60 30 10 60 0 50 C -10 60 -60 30 -45 -10 Z" fill="url(#roseGradient1)"/>
                        <path d="M -35 -5 C -45 -30 -5 -45 0 -30 C 5 -45 45 -30 35 -5 C 45 20 5 45 0 38 C -5 45 -45 20 -35 -5 Z" fill="url(#roseGradient2)"/>
                        <path d="M -20 -5 C -25 -20 0 -30 0 -15 C 15 -30 25 -15 20 0 C 25 15 0 25 -5 12 C -20 20 -25 5 -20 -5 Z" fill="#fda4af"/>
                        <circle cx="0" cy="-2" r="5" fill="#fff1f2"/>
                    </g>
                    <g id="front-rose" transform="translate(250, 335) scale(1.05)">
                        <path d="M -45 -10 C -60 -40 -10 -60 0 -40 C 10 -60 60 -40 45 -10 C 60 30 10 60 0 50 C -10 60 -60 30 -45 -10 Z" fill="url(#roseGradient2)"/>
                        <path d="M -35 -5 C -45 -30 -5 -45 0 -30 C 5 -45 45 -30 35 -5 C 45 20 5 45 0 38 C -5 45 -45 20 -35 -5 Z" fill="url(#roseGradient1)"/>
                        <path d="M -20 -5 C -25 -20 0 -30 0 -15 C 15 -30 25 -15 20 0 C 25 15 0 25 -5 12 C -20 20 -25 5 -20 -5 Z" fill="#fecdd3"/>
                        <circle cx="0" cy="-2" r="6" fill="#ffffff"/>
                    </g>
                    <g id="sparkles" fill="#fde047" class="sparkle-effect">
                        <path d="M 120 180 L 123 186 L 129 189 L 123 192 L 120 198 L 117 192 L 111 189 L 117 186 Z"/>
                        <path d="M 370 210 L 372 214 L 376 216 L 372 218 L 370 222 L 368 218 L 364 216 L 368 214 Z"/>
                        <path d="M 250 80 L 252 84 L 256 86 L 252 88 L 250 92 L 248 88 L 244 86 L 248 84 Z"/>
                        <circle cx="210" cy="120" r="2" fill="#fff"/>
                        <circle cx="290" cy="110" r="2.5" fill="#fff"/>
                        <circle cx="160" cy="240" r="2" fill="#fff"/>
                    </g>
                    <g id="satin-ribbon">
                        <path d="M 250 400 C 180 360 140 420 240 415 Z" fill="url(#ribbonGrad)" stroke="#9f1239" stroke-width="1"/>
                        <path d="M 250 400 C 320 360 360 420 260 415 Z" fill="url(#ribbonGrad)" stroke="#9f1239" stroke-width="1"/>
                        <path d="M 245 410 Q 210 450 180 500 Q 200 505 235 440 Z" fill="url(#ribbonGrad)"/>
                        <path d="M 255 410 Q 290 450 320 500 Q 300 505 265 440 Z" fill="url(#ribbonGrad)"/>
                        <rect x="238" y="396" width="24" height="20" rx="8" fill="#e11d48" stroke="#be123c" stroke-width="2"/>
                    </g>
                </svg>
            </div>
            <p class="text-rose-300/80 text-xs sm:text-sm font-light mt-2 text-center tracking-wider uppercase">
                Flores eternas para ti
            </p>
        </section>

        <!-- SOBRE + CARTA -->
        <section class="flex-1 flex flex-col items-center justify-center w-full min-h-[360px] sm:min-h-[420px] order-1 lg:order-2">
            <div class="perspective-1000 my-auto">
                <div id="envelope" class="envelope-wrapper" onclick="toggleEnvelope()">
                    <div class="envelope-back"></div>
                    <div id="letterCard" class="letter-card plantilla-clasica">
                        <div class="border-b border-rose-100 pb-3 mb-3 flex items-center justify-between letter-to">
                            <span id="letterToDisplay" class="font-serif-title font-bold text-lg sm:text-xl">Para: ...</span>
                            <i class="fa-solid fa-heart text-rose-500 text-sm"></i>
                        </div>
                        <div id="letterBodyDisplay" class="letter-body leading-relaxed space-y-3">
                            <p>Cargando carta...</p>
                        </div>
                        <div class="mt-6 pt-3 border-t border-rose-100/80 text-right letter-to">
                            <span id="letterFromDisplay" class="font-serif-title italic font-medium text-base sm:text-lg block"></span>
                        </div>
                    </div>
                    <div class="envelope-pocket-left"></div>
                    <div class="envelope-pocket-right"></div>
                    <div class="envelope-pocket-bottom"></div>
                    <div class="envelope-flap"></div>
                    <div class="wax-seal" title="Haz clic para abrir">
                        <i class="fa-solid fa-heart text-xl drop-shadow"></i>
                    </div>
                </div>
            </div>
            <p id="envelopeHint" class="text-rose-200/90 text-sm font-medium mt-12 bg-rose-950/40 px-5 py-2 rounded-full border border-rose-800/40 backdrop-blur-sm animate-pulse">
                <i class="fa-regular fa-hand-pointer mr-2"></i>Haz clic para abrir
            </p>
            <div id="shareButtons" class="mt-4 flex gap-2 flex-wrap justify-center" style="display:none;">
                <button onclick="copiarEnlace()" class="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-link mr-1"></i> Copiar enlace
                </button>
                <button id="editBtn" onclick="abrirEditor()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition" style="display:none;">
                    <i class="fa-solid fa-pen mr-1"></i> Editar
                </button>
            </div>
        </section>
    </main>

    <footer class="relative z-10 w-full py-4 text-center text-xs text-rose-300/40">
        Hecho con amor ❤️
    </footer>

    <!-- MODAL LOGIN -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-serif-title font-bold text-xl text-rose-200">Iniciar sesión</h3>
                <button onclick="cerrarModal('loginModal')" class="text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <input type="email" id="loginEmail" placeholder="Correo electrónico" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-rose-500">
                <input type="password" id="loginPassword" placeholder="Contraseña" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-rose-500">
                <button onclick="login()" class="w-full bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white font-medium py-3 rounded-lg text-sm">Entrar</button>
                <p class="text-center text-slate-400 text-xs">¿No tienes cuenta? <button onclick="cambiarModal('loginModal','registerModal')" class="text-rose-400 hover:underline">Regístrate</button></p>
            </div>
        </div>
    </div>

    <!-- MODAL REGISTRO -->
    <div id="registerModal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-serif-title font-bold text-xl text-rose-200">Crear cuenta</h3>
                <button onclick="cerrarModal('registerModal')" class="text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <input type="email" id="registerEmail" placeholder="Correo electrónico" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-rose-500">
                <input type="password" id="registerPassword" placeholder="Contraseña (mín. 6 caracteres)" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-rose-500">
                <button onclick="register()" class="w-full bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white font-medium py-3 rounded-lg text-sm">Registrarme</button>
                <p class="text-center text-slate-400 text-xs">¿Ya tienes cuenta? <button onclick="cambiarModal('registerModal','loginModal')" class="text-rose-400 hover:underline">Inicia sesión</button></p>
            </div>
        </div>
    </div>

    <!-- MODAL EDITOR DE CARTA -->
    <div id="editorModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 600px;">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-serif-title font-bold text-xl text-rose-200">Editar carta</h3>
                <button onclick="cerrarModal('editorModal')" class="text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-rose-300 uppercase tracking-wider mb-1">Destinatario</label>
                    <input type="text" id="inputTo" placeholder="Para: (ej. Maria Teresa)" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-rose-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-rose-300 uppercase tracking-wider mb-1">Mensaje</label>
                    <textarea id="inputBody" rows="5" placeholder="Escribe tu mensaje..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-rose-500 resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-rose-300 uppercase tracking-wider mb-1">Firma</label>
                    <input type="text" id="inputFrom" placeholder="Con amor, ..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-rose-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-rose-300 uppercase tracking-wider mb-1">Plantilla</label>
                    <select id="inputPlantilla" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-rose-500">
                        <option value="clasica">Clásica</option>
                        <option value="romantica">Romántica</option>
                        <option value="elegante">Elegante</option>
                        <option value="moderna">Moderna</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-rose-300 uppercase tracking-wider mb-1">Código de la carta (URL)</label>
                    <input type="text" id="inputCodigo" placeholder="ej: para-maria" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-rose-500">
                    <p class="text-xs text-slate-500 mt-1">Solo letras, números y guiones. Se generará uno automático si lo dejas vacío.</p>
                </div>
                <button onclick="guardarCarta()" class="w-full bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white font-medium py-3 rounded-lg text-sm mt-2">
                    <i class="fa-solid fa-save mr-1"></i> Guardar carta
                </button>
                <button onclick="cerrarModal('editorModal')" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 rounded-lg text-sm">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL MIS CARTAS -->
    <div id="myCardsModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 600px;">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-serif-title font-bold text-xl text-rose-200">Mis cartas</h3>
                <button onclick="cerrarModal('myCardsModal')" class="text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="myCardsList" class="space-y-2 max-h-96 overflow-y-auto">
                <p class="text-slate-400 text-sm text-center py-4">Cargando...</p>
            </div>
            <button onclick="nuevaCarta()" class="w-full bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white font-medium py-3 rounded-lg text-sm mt-3">
                <i class="fa-solid fa-plus mr-1"></i> Crear nueva carta
            </button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- ===== FIREBASE SDK ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, updateDoc, serverTimestamp }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ⚠️ REEMPLAZA ESTO CON TU firebaseConfig
        const firebaseConfig = {
            apiKey: "AIzaSyCKlEyQXSpjnos0Nq4ZSicOQm0TvEmxV8w",
            authDomain: "cartas-8ea04.firebaseapp.com",
            projectId: "cartas-8ea04",
            storageBucket: "cartas-8ea04.firebasestorage.app",
            messagingSenderId: "663895466574",
            appId: "1:663895466574:web:7533015ad2b1282e24191f",
            measurementId: "G-4K2Z2YF1YW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let cartaActual = null;
        let editando = false;

        // ===== AUTENTICACIÓN =====
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const authText = document.getElementById('authText');
            const authIcon = document.getElementById('authIcon');
            if (user) {
                authText.textContent = 'Salir';
                authIcon.className = 'fa-solid fa-right-from-bracket';
            } else {
                authText.textContent = 'Entrar';
                authIcon.className = 'fa-solid fa-user';
            }
        });

        window.handleAuthClick = () => {
            if (currentUser) {
                signOut(auth);
                mostrarToast('Sesión cerrada');
                document.getElementById('myCardsModal').classList.remove('active');
            } else {
                document.getElementById('loginModal').classList.add('active');
            }
        };

        window.login = async () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                cerrarModal('loginModal');
                mostrarToast('Bienvenido ❤️');
                cargarMisCartas();
            } catch (e) {
                mostrarToast('Error: ' + e.message);
            }
        };

        window.register = async () => {
            const email = document.getElementById('registerEmail').value;
            const pass = document.getElementById('registerPassword').value;
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                cerrarModal('registerModal');
                mostrarToast('Cuenta creada ✅');
                cargarMisCartas();
            } catch (e) {
                mostrarToast('Error: ' + e.message);
            }
        };

        window.cambiarModal = (cerrar, abrir) => {
            document.getElementById(cerrar).classList.remove('active');
            document.getElementById(abrir).classList.add('active');
        };

        window.cerrarModal = (id) => {
            document.getElementById(id).classList.remove('active');
        };

        // ===== CARGAR CARTA DESDE URL =====
        const params = new URLSearchParams(window.location.search);
        const codigoParam = params.get('c');

        async function cargarCartaPorCodigo(codigo) {
            try {
                const q = query(collection(db, 'cartas'), where('codigo', '==', codigo));
                const snap = await getDocs(q);
                if (snap.empty) {
                    mostrarToast('Carta no encontrada');
                    return;
                }
                const docSnap = snap.docs[0];
                const data = docSnap.data();
                cartaActual = { id: docSnap.id, ...data };
                pintarCarta(data);
                document.getElementById('shareButtons').style.display = 'flex';
                // Mostrar botón editar si es el dueño
                if (currentUser && data.creadorId === currentUser.uid) {
                    document.getElementById('editBtn').style.display = 'inline-block';
                }
            } catch (e) {
                console.error(e);
                mostrarToast('Error al cargar: ' + e.message);
            }
        }

        function pintarCarta(data) {
            document.getElementById('letterToDisplay').textContent = 'Para: ' + (data.destinatario || '...');
            document.getElementById('letterFromDisplay').textContent = data.firma || '';
            const bodyHTML = (data.mensaje || '').split('\n\n').filter(p => p.trim()).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
            document.getElementById('letterBodyDisplay').innerHTML = bodyHTML || '<p></p>';
            
            // Aplicar plantilla
            const card = document.getElementById('letterCard');
            card.className = 'letter-card';
            card.classList.add('plantilla-' + (data.plantilla || 'clasica'));
        }

        // ===== EDITOR =====
        window.abrirEditor = () => {
            if (!currentUser) { mostrarToast('Inicia sesión'); return; }
            if (cartaActual && cartaActual.creadorId === currentUser.uid) {
                editando = true;
                document.getElementById('inputTo').value = cartaActual.destinatario || '';
                document.getElementById('inputBody').value = cartaActual.mensaje || '';
                document.getElementById('inputFrom').value = cartaActual.firma || '';
                document.getElementById('inputPlantilla').value = cartaActual.plantilla || 'clasica';
                document.getElementById('inputCodigo').value = cartaActual.codigo || '';
            } else {
                nuevaCarta();
            }
            document.getElementById('editorModal').classList.add('active');
        };

        window.nuevaCarta = () => {
            if (!currentUser) { 
                cerrarModal('myCardsModal');
                document.getElementById('loginModal').classList.add('active');
                return;
            }
            editando = false;
            document.getElementById('inputTo').value = '';
            document.getElementById('inputBody').value = '';
            document.getElementById('inputFrom').value = '';
            document.getElementById('inputPlantilla').value = 'clasica';
            document.getElementById('inputCodigo').value = generarCodigoAleatorio();
            cerrarModal('myCardsModal');
            document.getElementById('editorModal').classList.add('active');
        };

        function generarCodigoAleatorio() {
            return Math.random().toString(36).substring(2, 8);
        }

        window.guardarCarta = async () => {
            if (!currentUser) { mostrarToast('Inicia sesión'); return; }
            const destinatario = document.getElementById('inputTo').value.trim();
            const mensaje = document.getElementById('inputBody').value.trim();
            const firma = document.getElementById('inputFrom').value.trim();
            const plantilla = document.getElementById('inputPlantilla').value;
            let codigo = document.getElementById('inputCodigo').value.trim().toLowerCase();

            if (!destinatario || !mensaje) {
                mostrarToast('Completa destinatario y mensaje');
                return;
            }
            if (!codigo) codigo = generarCodigoAleatorio();
            if (!/^[a-z0-9-]+$/.test(codigo)) {
                mostrarToast('Código solo letras, números y guiones');
                return;
            }

            try {
                // Verificar si el código ya existe
                if (!editando || (cartaActual && cartaActual.codigo !== codigo)) {
                    const q = query(collection(db, 'cartas'), where('codigo', '==', codigo));
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        mostrarToast('Ese código ya está en uso, elige otro');
                        return;
                    }
                }

                const datos = {
                    destinatario, mensaje, firma, plantilla, codigo,
                    creadorId: currentUser.uid,
                    actualizadoEn: serverTimestamp()
                };

                if (editando && cartaActual) {
                    await updateDoc(doc(db, 'cartas', cartaActual.id), datos);
                    cartaActual = { ...cartaActual, ...datos };
                    mostrarToast('Carta actualizada ✅');
                } else {
                    const nuevoDoc = doc(collection(db, 'cartas'));
                    await setDoc(nuevoDoc, { ...datos, creadoEn: serverTimestamp() });
                    cartaActual = { id: nuevoDoc.id, ...datos };
                    mostrarToast('Carta creada ✅');
                    window.history.replaceState({}, '', '?c=' + codigo);
                }

                pintarCarta(datos);
                document.getElementById('shareButtons').style.display = 'flex';
                document.getElementById('editBtn').style.display = 'inline-block';
                cerrarModal('editorModal');
            } catch (e) {
                console.error(e);
                mostrarToast('Error: ' + e.message);
            }
        };

        window.copiarEnlace = async () => {
            const url = window.location.origin + window.location.pathname + '?c=' + (cartaActual?.codigo || '');
            try {
                await navigator.clipboard.writeText(url);
                mostrarToast('Enlace copiado ✅');
            } catch {
                prompt('Copia el enlace:', url);
            }
        };

        // ===== MIS CARTAS =====
        async function cargarMisCartas() {
            if (!currentUser) return;
            const modal = document.getElementById('myCardsModal');
            const lista = document.getElementById('myCardsList');
            lista.innerHTML = '<p class="text-slate-400 text-sm text-center py-4">Cargando...</p>';
            modal.classList.add('active');

            try {
                const q = query(collection(db, 'cartas'), where('creadorId', '==', currentUser.uid));
                const snap = await getDocs(q);
                if (snap.empty) {
                    lista.innerHTML = '<p class="text-slate-400 text-sm text-center py-4">Aún no tienes cartas. ¡Crea la primera!</p>';
                    return;
                }
                lista.innerHTML = '';
                snap.forEach(d => {
                    const data = d.data();
                    const div = document.createElement('div');
                    div.className = 'bg-slate-800 border border-slate-700 rounded-lg p-3 flex justify-between items-center';
                    div.innerHTML = `
                        <div class="min-w-0">
                            <p class="text-rose-200 font-medium text-sm truncate">Para: ${data.destinatario}</p>
                            <p class="text-slate-400 text-xs truncate">?c=${data.codigo}</p>
                        </div>
                        <button class="text-rose-400 hover:text-rose-300 text-sm ml-2" onclick="abrirCartaDesdeLista('${data.codigo}')">
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    `;
                    lista.appendChild(div);
                });
            } catch (e) {
                lista.innerHTML = '<p class="text-red-400 text-sm text-center py-4">Error: ' + e.message + '</p>';
            }
        }

        window.abrirCartaDesdeLista = (codigo) => {
            window.history.replaceState({}, '', '?c=' + codigo);
            cargarCartaPorCodigo(codigo);
            cerrarModal('myCardsModal');
        };

        // Botón para ver "Mis cartas" cuando está logueado
        document.getElementById('authBtn').addEventListener('click', () => {
            if (currentUser) {
                // Si ya está logueado, mostramos menú: mis cartas o salir
                // Hacemos un pequeño menú contextual
                const accion = confirm('¿Ver tus cartas? Acepta = Ver cartas / Cancelar = Cerrar sesión');
                if (accion) cargarMisCartas();
                else signOut(auth);
            }
        });

        // ===== CARGA INICIAL =====
        if (codigoParam) {
            // Esperar a que auth resuelva
            const unsub = onAuthStateChanged(auth, (user) => {
                cargarCartaPorCodigo(codigoParam);
                unsub();
            });
        } else {
            // Sin código: mostrar editor para crear
            document.getElementById('letterToDisplay').textContent = 'Para: ...';
            document.getElementById('letterBodyDisplay').innerHTML = '<p>Haz clic en "Editar" o inicia sesión para crear tu primera carta.</p>';
            document.getElementById('letterFromDisplay').textContent = '';
        }

        // ===== SOBRE =====
        let isEnvelopeOpen = false;
        window.toggleEnvelope = () => {
            const envelope = document.getElementById('envelope');
            const hint = document.getElementById('envelopeHint');
            isEnvelopeOpen = !isEnvelopeOpen;
            if (isEnvelopeOpen) {
                envelope.classList.add('open');
                hint.style.opacity = '0';
                if (!audioPlaying) startAudio();
            } else {
                envelope.classList.remove('open');
                hint.style.opacity = '1';
            }
        };

        // ===== TOAST =====
        window.mostrarToast = (msg) => {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 3000);
        };

        // ===== PÉTALOS =====
        const canvas = document.getElementById('petalsCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
        class Petal {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = -20 - Math.random() * 50;
                this.size = 8 + Math.random() * 12;
                this.speedY = 0.8 + Math.random() * 1.5;
                this.speedX = -0.5 + Math.random() * 1.0;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = -1 + Math.random() * 2;
                this.opacity = 0.4 + Math.random() * 0.5;
                this.color = Math.random() > 0.3 ? '#fb7185' : '#f43f5e';
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y / 30) + this.speedX;
                this.rotation += this.rotationSpeed;
                if (this.y > height + 20 || this.x < -20 || this.x > width + 20) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size, -this.size / 2, -this.size, this.size, 0, this.size * 1.5);
                ctx.bezierCurveTo(this.size, this.size, this.size, -this.size / 2, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }
        const petals = Array.from({ length: 30 }, () => new Petal());
        function animatePetals() {
            ctx.clearRect(0, 0, width, height);
            petals.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animatePetals);
        }
        animatePetals();

        // ===== MÚSICA =====
        let audioCtx = null;
        let audioPlaying = false;
        let audioSequenceTimeout = null;
        const NOTES = {
            'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
            'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'A5': 880.00
        };
        const MELODY = [
            { note: 'E5', duration: 0.6 }, { note: 'D5', duration: 0.6 }, { note: 'C5', duration: 0.8 },
            { note: 'G4', duration: 0.8 }, { note: 'A4', duration: 0.6 }, { note: 'C5', duration: 0.6 },
            { note: 'E5', duration: 1.2 }, { note: 'D5', duration: 0.6 }, { note: 'C5', duration: 0.6 },
            { note: 'B4', duration: 0.8 }, { note: 'G4', duration: 0.8 }, { note: 'A4', duration: 1.4 },
            { note: 'C5', duration: 0.6 }, { note: 'E5', duration: 0.6 }, { note: 'G5', duration: 1.0 },
            { note: 'F5', duration: 0.6 }, { note: 'E5', duration: 0.6 }, { note: 'D5', duration: 1.2 }
        ];
        function playTone(freq, duration) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration + 0.6);
            } catch(e) { console.error(e); }
        }
        let noteIndex = 0;
        function playNextNote() {
            if (!audioPlaying) return;
            const item = MELODY[noteIndex];
            if (item && NOTES[item.note]) playTone(NOTES[item.note], item.duration);
            noteIndex = (noteIndex + 1) % MELODY.length;
            const delay = (item ? item.duration : 1) * 750;
            audioSequenceTimeout = setTimeout(playNextNote, delay);
        }
        function startAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            audioPlaying = true;
            document.getElementById('musicIcon').className = 'fa-solid fa-volume-high text-rose-400 animate-pulse';
            document.getElementById('musicText').textContent = 'Sonando';
            playNextNote();
        }
        function stopAudio() {
            audioPlaying = false;
            if (audioSequenceTimeout) clearTimeout(audioSequenceTimeout);
            document.getElementById('musicIcon').className = 'fa-solid fa-music text-rose-400';
            document.getElementById('musicText').textContent = 'Música';
        }
        window.toggleAudio = () => { if (audioPlaying) stopAudio(); else startAudio(); };
    </script>
